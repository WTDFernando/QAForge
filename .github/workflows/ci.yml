name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: qaforge }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qaforge
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Agent eval harness (no API calls)
        run: pnpm --filter @qaforge/ai eval -- --fake
      - name: E2E
        env:
          # Deterministic offline provider: exercises the full AI pipeline without an API key.
          QAFORGE_AI_PROVIDER: fake
        run: |
          pnpm db:deploy && pnpm db:seed
          (cd apps/api && node dist/main.js &)
          (cd apps/worker && node dist/main.js &)
          (cd apps/web && pnpm start &)
          npx wait-on -t 60000 http://localhost:4000/health http://localhost:3000/login
          cd apps/web && npx playwright install --with-deps chromium && pnpm e2e
