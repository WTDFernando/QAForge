# Local infrastructure. `docker compose up -d` starts Postgres (pgvector) and Redis.
# S3-compatible storage is not used yet (Phase 2 attachments); its image will be chosen then.
# `docker compose --profile app up --build` also runs the API, worker and web app in containers.
name: qaforge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qaforge
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Catches emails in development (scheduled reports): open http://localhost:8025.
  # Set SMTP_URL=smtp://localhost:1025 in .env to use it.
  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.33.1
    ports: ['1025:1025', '8025:8025']

  minio:
    profiles: [storage]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  minio-init:
    profiles: [storage]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/qaforge && echo bucket ready"

  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qaforge
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ['4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qaforge
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_URL: http://api:4000
    ports: ['3000:3000']
    depends_on: [api]

  # Malware scanning of uploads: `docker compose --profile scan up -d`, then set CLAMAV_HOST=localhost
  # (or clamav inside compose) for the API and worker. Signature download takes a minute on first start.
  clamav:
    profiles: [scan]
    image: clamav/clamav:1.4
    ports: ['3310:3310']
    volumes: [clamdb:/var/lib/clamav]
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      start_period: 120s
      retries: 5

  # Nightly pg_dump with retention: `docker compose --profile backup up -d`. See infra/backup/README.md.
  backup:
    profiles: [backup]
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: qaforge
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: '14'
      BACKUP_AT: '02:30'
    volumes:
      - ./infra/backup:/scripts:ro
      - ./.data/backups:/backups
    entrypoint: ['/bin/sh', '/scripts/scheduler.sh']
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
  clamdb:
