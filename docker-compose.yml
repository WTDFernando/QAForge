# Local infrastructure. `docker compose up -d` starts Postgres (pgvector), Redis and MinIO.
# `docker compose --profile app up --build` also runs the API, worker and web app in containers.
name: qaforge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qaforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/qaforge && echo bucket ready"

  api:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qaforge
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qaforge
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      redis: { condition: service_healthy }

  web:
    profiles: [app]
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
